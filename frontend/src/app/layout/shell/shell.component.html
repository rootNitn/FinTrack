<mat-sidenav-container class="h-screen">
  <mat-sidenav
    #drawer
    [opened]="sidebarOpen()"
    [mode]="isMobile() ? 'over' : 'side'"
    class="w-64 border-r border-black/10 bg-transparent dark:border-white/10"
  >
    <app-sidebar [isAdmin]="isAdmin()" (navigate)="onNavItemClick()" />
  </mat-sidenav>

  <mat-sidenav-content class="flex h-full flex-col">
    <app-navbar (menuToggle)="toggleSidebar()" />
    @if (loading.isLoading()) {
      <mat-progress-bar mode="indeterminate" class="!h-0.5" />
    }
    <main class="flex-1 overflow-y-auto p-4 md:p-6">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
