<nav class="flex h-full flex-col gap-1 overflow-y-auto p-3">
  <div class="mb-3 flex items-center gap-2 px-2 py-3">
    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-primary">
      <mat-icon>account_balance_wallet</mat-icon>
    </div>
    @if (!collapsed()) {
      <span class="text-base font-semibold tracking-tight">FinTrack</span>
    }
  </div>

  <div class="flex flex-col gap-0.5">
    @for (item of navItems; track item.route) {
      @if (!item.adminOnly || isAdmin()) {
        <a
          [routerLink]="item.route"
          routerLinkActive="nav-link-active"
          (click)="navigate.emit()"
          class="nav-link"
          [class.justify-center]="collapsed()"
        >
          <mat-icon class="nav-link-icon">{{ item.icon }}</mat-icon>
          @if (!collapsed()) {
            <span class="truncate">{{ item.label }}</span>
          }
        </a>
      }
    }
  </div>
</nav>
