<h2 mat-dialog-title>{{ isEdit ? 'Edit Health Goal' : 'Add Health Goal' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="!grid grid-cols-1 gap-2">
    @if (errorMessage()) {
      <div class="rounded-lg bg-loss/10 px-3 py-2 text-sm text-loss">{{ errorMessage() }}</div>
    }

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Goal type</mat-label>
      <mat-select formControlName="type">
        @for (t of goalTypes; track t) {
          <mat-option [value]="t">{{ t.replaceAll('_', ' ') }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Target value</mat-label>
      <input matInput type="number" step="0.1" formControlName="targetValue" />
      @if (form.controls.targetValue.hasError('required')) {
        <mat-error>Required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Deadline (optional)</mat-label>
      <input matInput [matDatepicker]="deadlinePicker" formControlName="deadline" />
      <mat-datepicker-toggle matSuffix [for]="deadlinePicker" />
      <mat-datepicker #deadlinePicker />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        {{ isEdit ? 'Save changes' : 'Add goal' }}
      }
    </button>
  </mat-dialog-actions>
</form>
