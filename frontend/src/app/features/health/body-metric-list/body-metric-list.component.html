<app-page-header title="Body Metrics" subtitle="Track weight, BMI and body measurements over time">
  <a mat-stroked-button routerLink="/health">
    <mat-icon>arrow_back</mat-icon>
    Back
  </a>
  <button mat-flat-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Log Entry
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [rows]="logs()"
  [loading]="loading()"
  emptyTitle="No body metric logs yet"
  emptyMessage="Log your first weight entry to start tracking your trend."
  emptyActionLabel="Log body metric"
  (emptyAction)="openCreateDialog()"
>
  <ng-template #rowActions let-row>
    <button mat-icon-button (click)="openEditDialog(row)" matTooltip="Edit">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button (click)="remove(row)" matTooltip="Delete">
      <mat-icon class="text-loss">delete</mat-icon>
    </button>
  </ng-template>
</app-data-table>
