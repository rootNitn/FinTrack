<h2 mat-dialog-title>{{ isEdit ? 'Edit Body Metric Log' : 'Log Body Metric' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="!grid grid-cols-1 gap-2 sm:grid-cols-2">
    @if (errorMessage()) {
      <div class="col-span-full rounded-lg bg-loss/10 px-3 py-2 text-sm text-loss">{{ errorMessage() }}</div>
    }

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="datePicker" formControlName="recordedAt" />
      <mat-datepicker-toggle matSuffix [for]="datePicker" />
      <mat-datepicker #datePicker />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Weight (kg)</mat-label>
      <input matInput type="number" step="0.1" formControlName="weightKg" />
      @if (form.controls.weightKg.hasError('required')) {
        <mat-error>Required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Height (cm)</mat-label>
      <input matInput type="number" step="0.1" formControlName="heightCm" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Body Fat %</mat-label>
      <input matInput type="number" step="0.1" formControlName="bodyFatPercent" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Waist (cm)</mat-label>
      <input matInput type="number" step="0.1" formControlName="waistCm" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="col-span-full w-full">
      <mat-label>Notes</mat-label>
      <textarea matInput formControlName="notes" rows="2"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        {{ isEdit ? 'Save changes' : 'Add log' }}
      }
    </button>
  </mat-dialog-actions>
</form>
