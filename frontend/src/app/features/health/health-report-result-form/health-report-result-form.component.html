<h2 mat-dialog-title>{{ isEdit ? 'Edit Result' : 'Add Result' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="!grid grid-cols-1 gap-2 sm:grid-cols-2">
    @if (errorMessage()) {
      <div class="col-span-full rounded-lg bg-loss/10 px-3 py-2 text-sm text-loss">{{ errorMessage() }}</div>
    }

    <mat-form-field appearance="outline" class="col-span-full w-full">
      <mat-label>Test name</mat-label>
      <input matInput formControlName="testName" />
      @if (form.controls.testName.hasError('required')) {
        <mat-error>Required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Value</mat-label>
      <input matInput type="number" step="0.01" formControlName="value" />
      @if (form.controls.value.hasError('required')) {
        <mat-error>Required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Unit</mat-label>
      <input matInput formControlName="unit" placeholder="mg/dL, g/dL, etc." />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Reference low</mat-label>
      <input matInput type="number" step="0.01" formControlName="referenceLow" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Reference high</mat-label>
      <input matInput type="number" step="0.01" formControlName="referenceHigh" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        {{ isEdit ? 'Save changes' : 'Add result' }}
      }
    </button>
  </mat-dialog-actions>
</form>
