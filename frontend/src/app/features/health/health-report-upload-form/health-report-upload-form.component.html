<h2 mat-dialog-title>Upload Health Report</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="!grid grid-cols-1 gap-2 sm:grid-cols-2">
    @if (errorMessage()) {
      <div class="col-span-full rounded-lg bg-loss/10 px-3 py-2 text-sm text-loss">{{ errorMessage() }}</div>
    }

    <div class="col-span-full">
      <p class="mb-1 text-sm text-black/60 dark:text-white/60">Report file (PDF, image or Excel/CSV)</p>
      <input type="file" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.xls,.csv" (change)="onFileSelected($event)" />
      @if (selectedFile()) {
        <p class="mt-1 text-xs text-black/50 dark:text-white/50">{{ selectedFile()!.name }}</p>
      }
    </div>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Report date</mat-label>
      <input matInput [matDatepicker]="datePicker" formControlName="reportDate" />
      <mat-datepicker-toggle matSuffix [for]="datePicker" />
      <mat-datepicker #datePicker />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Test date (when the sample was taken)</mat-label>
      <input matInput [matDatepicker]="testDatePicker" formControlName="testDate" />
      <mat-datepicker-toggle matSuffix [for]="testDatePicker" />
      <mat-datepicker #testDatePicker />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Lab name (optional)</mat-label>
      <input matInput formControlName="labName" />
    </mat-form-field>

    @if (needsPassword()) {
      <mat-form-field appearance="outline" class="col-span-full w-full">
        <mat-label>PDF password</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Upload &amp; Extract
      }
    </button>
  </mat-dialog-actions>
</form>
