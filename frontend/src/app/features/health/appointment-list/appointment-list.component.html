<app-page-header title="Doctor Appointments" subtitle="Manage upcoming and past appointments">
  <a mat-stroked-button routerLink="/health">
    <mat-icon>arrow_back</mat-icon>
    Back
  </a>
  <button mat-flat-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Add Appointment
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [rows]="appointments()"
  [loading]="loading()"
  emptyTitle="No appointments yet"
  emptyMessage="Add a doctor appointment to get reminders before the date."
  emptyActionLabel="Add appointment"
  (emptyAction)="openCreateDialog()"
>
  <ng-template #rowActions let-row>
    @if (row.status === 'SCHEDULED') {
      <button mat-icon-button (click)="markCompleted(row)" matTooltip="Mark completed">
        <mat-icon class="text-gain">check_circle</mat-icon>
      </button>
    }
    <button mat-icon-button (click)="openEditDialog(row)" matTooltip="Edit">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button (click)="remove(row)" matTooltip="Delete">
      <mat-icon class="text-loss">delete</mat-icon>
    </button>
  </ng-template>
</app-data-table>
