<h2 mat-dialog-title>Add Statement</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="grid grid-cols-1 gap-2 sm:grid-cols-2">
    @if (errorMessage()) {
      <div class="col-span-full rounded-lg bg-loss/10 px-3 py-2 text-sm text-loss">{{ errorMessage() }}</div>
    }

    <mat-form-field appearance="outline">
      <mat-label>Month (1-12)</mat-label>
      <input matInput type="number" formControlName="month" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Year</mat-label>
      <input matInput type="number" formControlName="year" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Statement Date</mat-label>
      <input matInput [matDatepicker]="statementPicker" formControlName="statementDate" />
      <mat-datepicker-toggle matIconSuffix [for]="statementPicker" />
      <mat-datepicker #statementPicker />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Due Date</mat-label>
      <input matInput [matDatepicker]="dueDatePicker" formControlName="dueDate" />
      <mat-datepicker-toggle matIconSuffix [for]="dueDatePicker" />
      <mat-datepicker #dueDatePicker />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Total Due</mat-label>
      <input matInput type="number" formControlName="totalDue" />
      @if (form.controls.totalDue.hasError('required')) {
        <mat-error>Required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Minimum Due</mat-label>
      <input matInput type="number" formControlName="minimumDue" />
      @if (form.controls.minimumDue.hasError('required')) {
        <mat-error>Required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Reward Points Earned</mat-label>
      <input matInput type="number" formControlName="rewardPointsEarned" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Cashback Earned</mat-label>
      <input matInput type="number" formControlName="cashbackEarned" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Add statement
      }
    </button>
  </mat-dialog-actions>
</form>
