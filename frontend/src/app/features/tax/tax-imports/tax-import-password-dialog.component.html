<h2 mat-dialog-title>Password Required</h2>

<mat-dialog-content>
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">
    This {{ data.typeLabel }} PDF is password-protected. Enter the password to decrypt it — it is
    used only for this one-time import and is never stored.
  </p>

  @if (errorMessage(); as message) {
    <div class="flex items-start gap-2 rounded-lg bg-red-500/10 text-red-600 dark:text-red-400 p-3 mb-4">
      <mat-icon class="shrink-0">error_outline</mat-icon>
      <span class="text-sm">{{ message }}</span>
    </div>
  }

  <form [formGroup]="form" class="pt-1" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>PDF Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="off" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [disabled]="submitting()" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="submitting()" (click)="submit()">
    @if (submitting()) {
      <mat-spinner diameter="18" class="inline-spinner"></mat-spinner>
    } @else {
      Unlock
    }
  </button>
</mat-dialog-actions>
