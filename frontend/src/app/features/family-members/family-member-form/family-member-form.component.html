<h2 mat-dialog-title>{{ isEdit ? 'Edit Family Member' : 'Add Family Member' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="!grid grid-cols-1 gap-2">
    @if (errorMessage()) {
      <div class="rounded-lg bg-loss/10 px-3 py-2 text-sm text-loss">{{ errorMessage() }}</div>
    }

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Priya" />
      @if (form.controls.name.hasError('required')) {
        <mat-error>Name is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Relation (optional)</mat-label>
      <input matInput formControlName="relation" placeholder="e.g. Spouse" [matAutocomplete]="relationAuto" />
      <mat-autocomplete #relationAuto="matAutocomplete">
        @for (r of relations; track r) {
          <mat-option [value]="r">{{ r }}</mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>

    <div class="flex items-center gap-2">
      <span class="text-sm text-on-surface-variant">Color</span>
      @for (c of colors; track c) {
        <button
          type="button"
          class="h-7 w-7 rounded-full border-2"
          [class.border-primary]="form.controls.color.value === c"
          [class.border-transparent]="form.controls.color.value !== c"
          [style.backgroundColor]="c"
          (click)="form.controls.color.setValue(c)"
        ></button>
      }
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        {{ isEdit ? 'Save changes' : 'Add member' }}
      }
    </button>
  </mat-dialog-actions>
</form>
