<h2 mat-dialog-title>Add Contribution</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="!flex flex-col gap-2">
    @if (errorMessage()) {
      <div class="rounded-lg bg-loss/10 px-3 py-2 text-sm text-loss">{{ errorMessage() }}</div>
    }

    <p class="text-sm text-black/60 dark:text-white/60">
      Contributing towards <strong>{{ data.goal.name }}</strong>
    </p>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Amount</mat-label>
      <input matInput type="number" step="0.01" formControlName="amount" />
      @if (form.controls.amount.hasError('required')) {
        <mat-error>Amount is required</mat-error>
      }
      @if (form.controls.amount.hasError('min')) {
        <mat-error>Amount must be greater than 0</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Date</mat-label>
      <input matInput type="date" formControlName="date" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Note (optional)</mat-label>
      <input matInput formControlName="note" maxlength="250" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Add contribution
      }
    </button>
  </mat-dialog-actions>
</form>
