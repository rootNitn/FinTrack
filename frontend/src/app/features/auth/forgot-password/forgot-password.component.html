<div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-sky-100 to-indigo-100 p-4 dark:from-slate-900 dark:to-slate-800">
  <div class="glass-card w-full max-w-sm p-8">
    <div class="mb-6 text-center">
      <mat-icon class="!h-10 !w-10 !text-4xl text-primary">lock_reset</mat-icon>
      <h1 class="mt-2 text-xl font-semibold">Forgot password</h1>
      <p class="text-sm text-black/60 dark:text-white/60">We'll send you a reset link</p>
    </div>

    @if (resultMessage()) {
      <div class="mb-4 rounded-lg bg-profit/10 px-3 py-2 text-sm text-profit">{{ resultMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-2">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.hasError('required')) {
          <mat-error>Email is required</mat-error>
        }
        @if (form.controls.email.hasError('email')) {
          <mat-error>Enter a valid email</mat-error>
        }
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" class="mt-2 h-11" [disabled]="submitting()">
        @if (submitting()) {
          <mat-spinner diameter="20" />
        } @else {
          Send reset link
        }
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-black/60 dark:text-white/60">
      <a routerLink="/auth/login" class="font-medium text-primary hover:underline">Back to sign in</a>
    </p>
  </div>
</div>
