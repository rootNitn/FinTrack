<app-page-header title="Change password" subtitle="Update your account password" />

<div class="glass-card max-w-md p-6">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-2">
    <mat-form-field appearance="outline">
      <mat-label>Current password</mat-label>
      <input matInput [type]="hideCurrent() ? 'password' : 'text'" formControlName="currentPassword" autocomplete="current-password" />
      <button mat-icon-button matSuffix type="button" (click)="hideCurrent.set(!hideCurrent())">
        <mat-icon>{{ hideCurrent() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>New password</mat-label>
      <input matInput [type]="hideNew() ? 'password' : 'text'" formControlName="newPassword" autocomplete="new-password" />
      <button mat-icon-button matSuffix type="button" (click)="hideNew.set(!hideNew())">
        <mat-icon>{{ hideNew() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      @if (form.controls.newPassword.hasError('pattern')) {
        <mat-error>Must be 8+ characters with upper, lower case letters and a number</mat-error>
      }
    </mat-form-field>

    <button mat-flat-button color="primary" type="submit" class="mt-2 h-11 w-fit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Update password
      }
    </button>
  </form>
</div>
