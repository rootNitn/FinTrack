<app-page-header
  title="Upgrade your plan"
  [subtitle]="
    requiredPlan()
      ? 'This feature needs the ' + requiredPlan() + ' plan or higher.'
      : 'Unlock more of LifeTrack with Plus or Pro.'
  "
/>

<div class="mb-6 flex justify-center">
  <mat-button-toggle-group [value]="billingCycle()" (change)="billingCycle.set($event.value)" class="rounded-full">
    <mat-button-toggle value="MONTHLY">Monthly</mat-button-toggle>
    <mat-button-toggle value="YEARLY">Yearly</mat-button-toggle>
  </mat-button-toggle-group>
</div>

<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 max-w-3xl mx-auto">
  @for (plan of plans; track plan.id) {
    <div
      class="glass-card flex flex-col gap-3 p-5"
      [class.ring-2]="plan.highlighted"
      [class.ring-primary]="plan.highlighted"
    >
      <div>
        <h2 class="text-lg font-semibold">{{ plan.name }}</h2>
        <p class="text-sm text-black/60 dark:text-white/60">{{ plan.tagline }}</p>
      </div>

      <div class="flex items-baseline gap-1">
        <span class="text-3xl font-bold">{{ priceLabel(plan) }}</span>
        <span class="text-sm text-black/50 dark:text-white/50">{{ periodLabel() }}</span>
      </div>
      @if (savingsLabel(plan); as savings) {
        <span class="text-xs font-medium text-profit">{{ savings }}</span>
      }

      <ul class="flex flex-col gap-1.5 text-sm">
        @for (feature of plan.features; track feature) {
          <li class="flex items-center gap-2">
            <mat-icon class="!h-4 !w-4 !text-base text-profit">check_circle</mat-icon>
            {{ feature }}
          </li>
        }
      </ul>

      <button
        mat-flat-button
        color="primary"
        class="mt-auto"
        [disabled]="isCurrentPlan(plan) || processingPlanId() === plan.id"
        (click)="upgrade(plan)"
      >
        @if (processingPlanId() === plan.id) {
          <mat-spinner diameter="20" class="inline-block" />
        } @else if (isCurrentPlan(plan)) {
          Current plan
        } @else {
          {{ plan.ctaLabel }}
        }
      </button>
    </div>
  }
</div>
