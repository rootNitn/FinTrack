<button
  type="button"
  class="fixed bottom-5 right-5 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-primary text-white shadow-lg transition-transform hover:scale-105"
  matTooltip="AI Assistant"
  (click)="toggle()"
>
  <mat-icon>{{ open() ? 'close' : 'smart_toy' }}</mat-icon>
</button>

@if (open()) {
  <div
    class="fixed bottom-24 right-5 z-50 flex h-[500px] w-[360px] max-w-[calc(100vw-2.5rem)] flex-col overflow-hidden rounded-2xl border border-black/10 bg-white shadow-2xl dark:border-white/10 dark:bg-surface-dark"
  >
    <div class="flex items-center justify-between gap-2 bg-primary px-4 py-3 text-white">
      <div class="flex items-center gap-2">
        <mat-icon>smart_toy</mat-icon>
        <span class="font-semibold">AI Assistant</span>
      </div>
      <button type="button" mat-icon-button (click)="close()" aria-label="Close chat">
        <mat-icon class="!text-white">close</mat-icon>
      </button>
    </div>

    <div class="flex-1 space-y-3 overflow-y-auto px-3 py-3">
      @for (msg of messages(); track $index) {
        <div class="flex flex-col gap-2" [class.items-end]="msg.role === 'user'">
          @if (msg.text) {
            <div
              class="max-w-[85%] whitespace-pre-wrap rounded-2xl px-3 py-2 text-sm"
              [class.bg-primary]="msg.role === 'user'"
              [class.text-white]="msg.role === 'user'"
              [class.bg-black]="msg.role === 'assistant' && !msg.isError"
              [class.bg-opacity-5]="msg.role === 'assistant' && !msg.isError"
              [class.dark:bg-white]="msg.role === 'assistant' && !msg.isError"
              [class.dark:bg-opacity-10]="msg.role === 'assistant' && !msg.isError"
              [class.text-loss]="msg.isError"
            >
              {{ msg.text }}
            </div>
          }
          @if (msg.proposedAction && !msg.actionResolved) {
            <div class="max-w-[85%] rounded-2xl border border-primary/30 bg-primary/5 px-3 py-2 text-sm">
              <div class="mb-2 font-medium">{{ msg.proposedAction.label }}?</div>
              <pre class="mb-2 overflow-x-auto whitespace-pre-wrap text-xs opacity-70">{{ msg.proposedAction.arguments | json }}</pre>
              <div class="flex gap-2">
                <button
                  type="button"
                  mat-flat-button
                  color="primary"
                  [disabled]="confirmingAction()"
                  (click)="confirmAction(msg)"
                >
                  Confirm
                </button>
                <button type="button" mat-button [disabled]="confirmingAction()" (click)="dismissAction(msg)">Cancel</button>
              </div>
            </div>
          }
        </div>
      }
      @if (sending()) {
        <div class="flex justify-start">
          <div class="rounded-2xl bg-black/5 px-3 py-2 dark:bg-white/10">
            <mat-progress-spinner diameter="18" mode="indeterminate" />
          </div>
        </div>
      }
      <div #scrollAnchor></div>
    </div>

    <div class="flex items-end gap-2 border-t border-black/10 p-2 dark:border-white/10">
      <textarea
        rows="1"
        class="max-h-24 flex-1 resize-none rounded-lg border border-black/10 bg-transparent px-3 py-2 text-sm outline-none focus:border-primary dark:border-white/10"
        placeholder="Ask about your finances..."
        [value]="draft()"
        (input)="onDraftInput($event)"
        (keydown)="onKeydown($event)"
      ></textarea>
      <button
        type="button"
        mat-icon-button
        color="primary"
        [disabled]="!draft().trim() || sending()"
        (click)="send()"
        aria-label="Send message"
      >
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </div>
}
